version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cache_demo_postgres
    restart: always
    environment:
      POSTGRES_USER: codeus_user
      POSTGRES_PASSWORD: codeus_password
      POSTGRES_DB: cache_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: cache_demo_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
