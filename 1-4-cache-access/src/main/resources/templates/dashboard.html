<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Golf Tournament Dashboard</title>

    <style>
        /* === Base Styling === */
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to right, #f9fafc, #eef2f7);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        h2, h3 {
            text-align: center;
            font-weight: 600;
            color: #1e3a8a;
        }

        .section {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            max-height: 90vh;
            transition: transform 0.2s ease-in-out;
        }

        .section:hover {
            transform: translateY(-3px);
        }

        /* === Table Styling === */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 10px 0 20px 0;
            font-size: 0.95em;
        }

        th, td {
            padding: 10px 14px;
            text-align: left;
        }

        th {
            background: #1e3a8a;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 0.85em;
        }

        tr:nth-child(even) td {
            background: #f8fafc;
        }

        tr:hover td {
            background: #e0e7ff;
        }

        td {
            border-bottom: 1px solid #e5e7eb;
        }

        /* === Tournament Headings === */
        h3 {
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 6px;
            color: #111827;
            font-size: 1.05em;
        }

        /* === Section titles === */
        h2 {
            font-size: 1.4em;
            margin-bottom: 12px;
        }

        /* === Refresh indicator === */
        .refresh {
            position: fixed;
            top: 10px;
            right: 20px;
            color: #6b7280;
            font-size: 0.9em;
            opacity: 0.7;
        }

        /* === Scrollbars === */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #9ca3af;
            border-radius: 8px;
        }
    </style>

    <meta http-equiv="refresh" content="10"> <!-- Auto-refresh every 10s -->
</head>
<body>

<div class="refresh">⟳ Auto-refresh every 10 seconds</div>

<div class="section">
    <h2>🏦 Database State</h2>
    <div th:each="t : ${dbTournaments}">
        <h3 th:text="${t.name} + ' (' + ${t.location} + ')'"></h3>
        <table>
            <thead>
            <tr><th>Golfer</th><th>Golfer ID</th><th>Holes Played</th><th>Scores</th></tr>
            </thead>
            <tbody>
            <tr th:each="g : ${t.golfers}">
                <td th:text="${g.name}"></td>
                <td th:text="${g.id}"></td>
                <td th:text="${#maps.size(g.holeScores)}"></td>
                <td th:text="${g.holeScores}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="section">
    <h2>⚡ Cache State</h2>

    <div th:each="t : ${cacheTournaments}">
        <h3 th:text="${t.name} + ' (' + ${t.location} + ')'"></h3>
        <table>
            <thead>
            <tr><th>Golfer</th><th>ID</th></tr>
            </thead>
            <tbody>
            <tr th:each="g : ${t.golfers}">
                <td th:text="${g.name}"></td>
                <td th:text="${g.id}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <h3>🏌️ Golfers (from cache)</h3>
    <table>
        <thead>
        <tr><th>Name</th><th>Scores</th></tr>
        </thead>
        <tbody>
        <tr th:each="g : ${cacheGolfers}">
            <td th:text="${g.name}"></td>
            <td th:text="${g.holeScores}"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
